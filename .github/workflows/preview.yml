# Pull requests: build the site with Hugo and upload it as a new Worker
# version under a stable preview alias, so every push to a PR lands on the
# same URL: https://pr-<number>-cge-dev.<account>.workers.dev. Nothing here
# touches production: `versions upload` never changes what cge.dev serves.
name: Preview

on:
  pull_request:

# One run per PR; a newer push cancels the older run.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # sticky preview comment

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true  # themes/hugo-coder
          fetch-depth: 0  # enableGitInfo reads each page's last commit

      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: "0.143.0"
          extended: true

      # A preview alias URL is <alias>-<worker>.<subdomain>.workers.dev, and
      # only Cloudflare knows the account's workers.dev subdomain. Ask for it
      # up front so the site can be built with the preview as its base URL:
      # canonical links, the feed and share images then point at the preview
      # rather than at cge.dev.
      - name: Work out the preview URL
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          subdomain=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq --raw-output '.result.subdomain')
          if [ -z "$subdomain" ] || [ "$subdomain" = null ]; then
            echo "::error::No workers.dev subdomain returned. Check the secrets" \
              "and that the account has a workers.dev subdomain."
            exit 1
          fi
          echo "alias=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=https://pr-$PR_NUMBER-cge-dev.$subdomain.workers.dev" >> "$GITHUB_OUTPUT"

      - run: hugo --baseURL "${{ steps.preview.outputs.url }}/"

      - name: Upload preview version
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload
            --preview-alias=${{ steps.preview.outputs.alias }}
            --message="PR #${{ github.event.pull_request.number }}"

      - name: Preview link on the PR
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: preview
          message: |
            **Preview** · ${{ steps.preview.outputs.url }}
            Built from ${{ github.event.pull_request.head.sha }}
