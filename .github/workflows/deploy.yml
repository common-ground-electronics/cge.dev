# Pushes to main: build the site with Hugo, then deploy the Worker declared in
# wrangler.toml. The first deploy also creates the Worker itself and the
# cge.dev custom domain (DNS record plus certificate); pull-request previews
# cannot be uploaded until that has happened once. `workflow_dispatch` allows
# a redeploy by hand from the Actions tab, which GitHub only offers once this
# file is on the default branch.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true  # themes/hugo-coder
          fetch-depth: 0  # enableGitInfo reads each page's last commit

      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: "0.143.0"
          extended: true

      - run: hugo

      - name: Deploy to production
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
